name: Universal Saree Analyzer (CPU Only)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze-saree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install "mediapipe==0.10.9" "opencv-python-headless==4.9.0.80" "numpy<2.0"
          pip install transformers torch torchvision pillow ultralytics

      - name: Create output folder
        run: mkdir -p out_saree

      - name: Run Advanced Saree Analysis
        run: python analyze_image.py

      - name: Upload Analysis Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saree-analysis
          path: out_saree/
          if-no-files-found: warn
