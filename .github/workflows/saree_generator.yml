name: Generate Standalone Saree

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate-saree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Setup Blender
        run: |
          wget https://download.blender.org/release/Blender3.6/blender-3.6.5-linux-x64.tar.xz
          tar -xf blender-3.6.5-linux-x64.tar.xz
          mv blender-3.6.5-linux-x64 blender
          
      - name: Run Blender Saree Simulation
        run: ./blender/blender --background --python generate_saree.py

      - name: Upload Animated Saree GLB
        uses: actions/upload-artifact@v4
        with:
          name: standalone-saree
          path: output/standalone_saree.glb
