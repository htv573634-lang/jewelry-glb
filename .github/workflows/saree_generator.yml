name: Generate Standalone Saree

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate-saree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Run Blender Saree Simulation
        run: blender --background --python generate_saree.py

      - name: Upload Animated Saree GLB
        uses: actions/upload-artifact@v4
        with:
          name: standalone-saree
          path: output/standalone_saree.glb
