name: Scaffold Repo Tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create directory tree
        run: |
          mkdir -p .github/workflows
          mkdir -p generators
          mkdir -p scripts
          mkdir -p docs
          mkdir -p outputs/ring
          mkdir -p outputs/necklace
          mkdir -p outputs/mangalsutra
          mkdir -p outputs/earring
          mkdir -p outputs/bracelet
          mkdir -p outputs/watch
          mkdir -p outputs/gemstone

      - name: Add .gitkeep to empty directories
        run: |
          for d in outputs/ring outputs/necklace outputs/mangalsutra \
                   outputs/earring outputs/bracelet outputs/watch \
                   outputs/gemstone docs; do
            touch "$d/.gitkeep"
          done

      - name: Create generator stubs
        run: |
          for f in rings necklaces mangalsutra earrings bracelets watches gemstones; do
            if [ ! -f "generators/${f}.py" ]; then
              echo "# generators/${f}.py — implemented in build_library.py" > "generators/${f}.py"
            fi
          done
          touch generators/__init__.py

      - name: Create requirements.txt
        run: |
          if [ ! -f requirements.txt ]; then
            cat > requirements.txt << 'EOF'
          trimesh==4.4.3
          numpy==1.26.4
          Pillow==10.4.0
          scipy==1.13.1
          EOF
          fi

      - name: Create .gitignore
        run: |
          if [ ! -f .gitignore ]; then
            cat > .gitignore << 'EOF'
          __pycache__/
          *.pyc
          .DS_Store
          *.egg-info/
          .venv/
          venv/
          # Keep .glb and .json outputs (they are committed)
          # Uncomment the next line if you want to ignore outputs:
          # outputs/**/*.glb
          EOF
          fi

      - name: Generate README with tree
        run: |
          INSTALL_TREE=""
          if ! command -v tree >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq tree
          fi
          {
            echo "# jewelry-glb"
            echo ""
            echo "Procedurally generated 3D jewelry library for the HMR2.0 / MoGe avatar pipeline."
            echo ""
            echo "## Structure"
            echo ""
            echo '```'
            tree -I '.git|__pycache__' --charset ascii
            echo '```'
            echo ""
            echo "## Usage"
            echo ""
            echo "1. Edit \`scripts/build_library.py\` to add or change jewelry variants."
            echo "2. Push to \`main\` — the \`build_jewelry\` workflow regenerates all GLBs."
            echo "3. Download the latest artifact or browse \`outputs/\`."
            echo ""
            echo "_Tree auto-generated by GitHub Actions._"
          } > README.md

      - name: Commit scaffold
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: scaffold repository tree"
          branch: main
          file_pattern: "."
