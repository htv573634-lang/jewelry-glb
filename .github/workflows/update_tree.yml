name: Update README Tree

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tree
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tree

      - name: Regenerate README tree section
        run: |
          {
            echo "# jewelry-glb"
            echo ""
            echo "Procedurally generated 3D jewelry library for the HMR2.0 / MoGe avatar pipeline."
            echo ""
            echo "## Structure"
            echo ""
            echo '```'
            tree -I '.git|__pycache__' --charset ascii
            echo '```'
            echo ""
            echo "## Usage"
            echo ""
            echo "1. Edit \`scripts/build_library.py\` to add or change jewelry variants."
            echo "2. Push to \`main\` — the \`build_jewelry\` workflow regenerates all GLBs."
            echo "3. Download the latest artifact or browse \`outputs/\`."
            echo ""
            echo "_Tree auto-generated by GitHub Actions._"
          } > README.md

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update tree"
          branch: main
